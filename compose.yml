services:
  db:
    image: postgres:16
    container_name: shared-home-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shared_home
      POSTGRES_PASSWORD: shared_home_password
      POSTGRES_DB: shared_home
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
